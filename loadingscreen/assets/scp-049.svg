<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <pattern id="grid049" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid049)"/>

  <!-- SCP-049 Plague Doctor Robe and Beak Mask -->
  <g transform="translate(200, 150)">
    <!-- Hood and Cloak -->
    <path d="M -50,120 L -35,10 Q -50,-40 -25,-60 Q 0,-85 25,-60 Q 50,-40 35,10 L 50,120 Z" fill="#1e272e" stroke="#00d2d3" stroke-width="2"/>
    
    <!-- Plague Doctor Beak Mask -->
    <path d="M -20,-40 Q -15,-70 0,-70 Q 15,-70 20,-40 Q 12,-10 0,5 Q -12,-10 -20,-40 Z" fill="#f1f2f6" stroke="#222" stroke-width="1.5"/>
    <!-- Curved Beak downwards -->
    <path d="M -12,-20 C -15,10 -8,25 0,38 C 8,25 15,10 12,-20 Z" fill="#dfe4ea" stroke="#2f3542" stroke-width="2"/>
    <!-- Dark Eye Lenses -->
    <circle cx="-10" cy="-35" r="5" fill="#111" stroke="#2f3542" stroke-width="1.5"/>
    <circle cx="10" cy="-35" r="5" fill="#111" stroke="#2f3542" stroke-width="1.5"/>
    
    <!-- Doctor Bag / Scalpel silhouette -->
    <rect x="-42" y="50" width="26" height="20" rx="3" fill="#2f3640" stroke="#00d2d3" stroke-width="1.5"/>
    <path d="M -34,50 L -34,45 L -24,45 L -24,50" fill="none" stroke="#00d2d3" stroke-width="1.5"/>
  </g>

  <!-- Technical specs -->
  <text x="15" y="22" fill="#00d2d3" font-family="monospace" font-size="11" font-weight="bold">ANOMALY SCHEMATIC: SCP-049</text>
  <text x="15" y="37" fill="#888" font-family="monospace" font-size="9">CLASS: EUCLID // BIOLOGICAL LETHAL TOUCH</text>
  <text x="385" y="285" text-anchor="end" fill="#00d2d3" font-family="monospace" font-size="9">CURE MANIFESTATION: ACTIVE</text>
</svg>
