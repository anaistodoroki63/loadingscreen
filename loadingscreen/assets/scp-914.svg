<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <pattern id="grid914" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid914)"/>

  <!-- Clockwork gears and dial schematic -->
  <g transform="translate(200, 145)">
    <!-- Main central clockwork mechanism -->
    <!-- Large Gear -->
    <g transform="rotate(20)">
      <circle cx="0" cy="0" r="45" fill="#2c3e50" stroke="#f39c12" stroke-width="2"/>
      <circle cx="0" cy="0" r="15" fill="#1a1a1a" stroke="#f39c12" stroke-width="2"/>
      <!-- Teeth -->
      <rect x="-4" y="-52" width="8" height="10" fill="#f39c12"/>
      <rect x="-4" y="42" width="8" height="10" fill="#f39c12"/>
      <rect x="-52" y="-4" width="10" height="8" fill="#f39c12"/>
      <rect x="42" y="-4" width="10" height="8" fill="#f39c12"/>
      <rect x="-38" y="-38" width="8" height="8" fill="#f39c12" transform="rotate(45)"/>
      <rect x="30" y="-38" width="8" height="8" fill="#f39c12" transform="rotate(45)"/>
      <rect x="-38" y="30" width="8" height="8" fill="#f39c12" transform="rotate(45)"/>
      <rect x="30" y="30" width="8" height="8" fill="#f39c12" transform="rotate(45)"/>
    </g>

    <!-- Left booth: INPUT -->
    <rect x="-140" y="-40" width="60" height="80" rx="3" fill="#1e272e" stroke="#2ecc71" stroke-width="2"/>
    <text x="-110" y="5" fill="#2ecc71" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">INPUT</text>
    <path d="M -80,0 L -50,0" stroke="#f39c12" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Right booth: OUTPUT -->
    <rect x="80" y="-40" width="60" height="80" rx="3" fill="#1e272e" stroke="#2ecc71" stroke-width="2"/>
    <text x="110" y="5" fill="#2ecc71" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">OUTPUT</text>
    <path d="M 50,0 L 80,0" stroke="#f39c12" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Dial Selector Indicator -->
    <circle cx="0" cy="70" r="18" fill="#222" stroke="#f1c40f" stroke-width="2"/>
    <line x1="0" y1="70" x2="10" y2="60" stroke="#ff003c" stroke-width="2"/>
    <text x="0" y="105" fill="#f1c40f" font-family="monospace" font-size="8" text-anchor="middle">ROUGH | 1:1 | FINE | VERY FINE</text>
  </g>

  <!-- Technical specs -->
  <text x="15" y="22" fill="#2ecc71" font-family="monospace" font-size="11" font-weight="bold">ANOMALY SCHEMATIC: SCP-914</text>
  <text x="15" y="37" fill="#888" font-family="monospace" font-size="9">CLASS: SAFE // MECHANICAL TRANSMUTATION</text>
  <text x="385" y="285" text-anchor="end" fill="#2ecc71" font-family="monospace" font-size="9">STATUS: OPERATIONAL</text>
</svg>
