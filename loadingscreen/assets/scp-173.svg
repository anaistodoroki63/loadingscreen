<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sc173Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b9580b" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Grid background -->
  <pattern id="grid173" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid173)"/>

  <!-- Technical measurements & crosshairs -->
  <line x1="200" y1="20" x2="200" y2="280" stroke="#e67e22" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="40" y1="150" x2="360" y2="150" stroke="#e67e22" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- SCP-173 stylized silhouette and face markings -->
  <g transform="translate(200, 140)">
    <!-- Base pedestal / legs -->
    <ellipse cx="0" cy="110" rx="35" ry="12" fill="#222" stroke="#e67e22" stroke-width="2"/>
    <path d="M -25,110 L -20,60 L 20,60 L 25,110 Z" fill="#2b2d35" stroke="#e67e22" stroke-width="1.5"/>

    <!-- Torso -->
    <ellipse cx="0" cy="30" rx="42" ry="50" fill="#353b48" stroke="#e67e22" stroke-width="2"/>

    <!-- Stubby arms -->
    <path d="M -40,10 Q -65,25 -50,45 Q -38,40 -35,25 Z" fill="#444b58" stroke="#e67e22" stroke-width="1.5"/>
    <path d="M 40,10 Q 65,25 50,45 Q 38,40 35,25 Z" fill="#444b58" stroke="#e67e22" stroke-width="1.5"/>

    <!-- Bulbous Head -->
    <ellipse cx="0" cy="-45" rx="36" ry="48" fill="#3f4552" stroke="#e67e22" stroke-width="2"/>

    <!-- Krylon paint facial markings (green & black/red) -->
    <!-- Black blotches / eyes -->
    <circle cx="-14" cy="-55" r="7" fill="#111" stroke="#000" stroke-width="1"/>
    <circle cx="14" cy="-55" r="7" fill="#111" stroke="#000" stroke-width="1"/>
    <!-- Green spray streaks -->
    <path d="M -18,-70 C -12,-85 10,-80 18,-68 C 10,-60 -5,-62 -18,-70 Z" fill="#27ae60" opacity="0.85"/>
    <path d="M -8,-40 C 2,-32 10,-30 16,-42 C 8,-36 -2,-36 -8,-40 Z" fill="#e74c3c" opacity="0.85"/>
  </g>

  <!-- Spec labels -->
  <text x="15" y="25" fill="#e67e22" font-family="monospace" font-size="11" font-weight="bold">ANOMALY SCHEMATIC: SCP-173</text>
  <text x="15" y="40" fill="#888" font-family="monospace" font-size="9">CLASS: EUCLID // CONSTANT EYE CONTACT REQ.</text>
  <text x="385" y="285" text-anchor="end" fill="#e67e22" font-family="monospace" font-size="9">METRIC: 2.05m / CONCRETE-KRYLON</text>
</svg>
