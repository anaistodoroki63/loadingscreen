<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Glow filter -->
    <filter id="scpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#cfd8dc" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78909c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>

  <!-- Background decorative rings -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 6"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="currentColor" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="currentColor" stroke-width="12" stroke-opacity="0.85"/>
  <circle cx="250" cy="250" r="130" fill="none" stroke="currentColor" stroke-width="4" stroke-opacity="0.7"/>
  <circle cx="250" cy="250" r="62" fill="none" stroke="currentColor" stroke-width="14" stroke-opacity="0.9"/>
  <circle cx="250" cy="250" r="28" fill="currentColor" opacity="0.9"/>

  <!-- Three inward arrows at 0 deg, 120 deg, 240 deg -->
  <!-- Top Arrow (90 deg rotated / pointing down toward center) -->
  <g transform="translate(250,250)">
    <!-- Arrow 1 (Top pointing down) -->
    <g transform="rotate(0)">
      <path d="M -32,-195 L 32,-195 L 32,-115 L 60,-115 L 0,-40 L -60,-115 L -32,-115 Z" fill="currentColor" opacity="0.95"/>
    </g>
    <!-- Arrow 2 (Bottom-Right pointing toward center) -->
    <g transform="rotate(120)">
      <path d="M -32,-195 L 32,-195 L 32,-115 L 60,-115 L 0,-40 L -60,-115 L -32,-115 Z" fill="currentColor" opacity="0.95"/>
    </g>
    <!-- Arrow 3 (Bottom-Left pointing toward center) -->
    <g transform="rotate(240)">
      <path d="M -32,-195 L 32,-195 L 32,-115 L 60,-115 L 0,-40 L -60,-115 L -32,-115 Z" fill="currentColor" opacity="0.95"/>
    </g>
  </g>
</svg>
